[build]
  command = "pnpm build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# 아래 헤더는 next.config.mjs의 securityHeaders와 동일하게 유지해야 한다.
# Content-Security-Policy는 여기에 두지 않는다 — proxy.ts가 요청마다 nonce를 만들어
# CSP를 보내는 단일 출처이고, @netlify/plugin-nextjs는 그 middleware를 Netlify Edge Function으로
# 돌리므로 Netlify 배포에서도 같은 CSP가 적용된다. 여기서 CSP를 또 보내면 응답에 헤더가 두 개가 되고
# 'unsafe-inline'이 남은 복사본 때문에 nonce 전환이 조용히 무의미해진다.
# CSP를 고칠 일이 있으면 proxy.ts만 고친다.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
